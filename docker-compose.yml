services:
  postgres:
    image: postgres:16
    container_name: fairresolve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairresolve
      POSTGRES_PASSWORD: fairresolve
      POSTGRES_DB: fairresolve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairresolve -d fairresolve"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
